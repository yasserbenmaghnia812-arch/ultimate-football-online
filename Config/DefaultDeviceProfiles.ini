; Android low-end profile tuned as a conservative starting point for 4 GB RAM phones.
; Validate with Unreal Insights and on-device thermal/frame-time tests before raising quality.

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.MobileHDR=0
+CVars=r.Mobile.AntiAliasing=0
+CVars=r.MSAACount=1
+CVars=r.ScreenPercentage=60
+CVars=r.ViewDistanceScale=0.45
+CVars=r.ShadowQuality=0
+CVars=r.Shadow.CSM.MaxCascades=0
+CVars=r.DistanceFieldShadowing=0
+CVars=r.ContactShadows=0
+CVars=r.AmbientOcclusionLevels=0
+CVars=r.BloomQuality=0
+CVars=r.MotionBlurQuality=0
+CVars=r.LensFlareQuality=0
+CVars=r.DepthOfFieldQuality=0
+CVars=r.SceneColorFringeQuality=0
+CVars=r.VolumetricFog=0
+CVars=r.SSR.Quality=0
+CVars=r.SSGI.Enable=0
+CVars=r.RayTracing=0
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=0
