name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          projectPath: .
          buildMethod: FootballBuildScript.BuildAndroid
          buildsPath: build
          buildName: UltimateFootball
          versioning: Semantic
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Football-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
