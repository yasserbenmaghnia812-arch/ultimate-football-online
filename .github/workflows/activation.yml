name: Request Unity Personal License
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  activation:
    name: Generate Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Generate manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.32f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Manual-Activation-File
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
