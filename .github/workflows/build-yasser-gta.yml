name: YASSER GTA Android and Dedicated Server Builds

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-yasser-gta.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      unity_license_configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether a Unity CI license is configured
        id: check
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Unity license secret is present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build skipped: add a valid UNITY_LICENSE repository secret before building."
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: needs.preflight.outputs.unity_license_configured == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android APK
            targetPlatform: Android
            buildName: YASSER-GTA
            artifactName: YASSER-GTA-Android-APK
            artifactPath: build/Android
          - label: Linux Dedicated Server
            targetPlatform: StandaloneLinux64
            buildName: YASSER-GTA-Server
            artifactName: YASSER-GTA-Linux-Server
            artifactPath: build/StandaloneLinux64
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Build with Unity 2020.3.26f1
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2020.3.26f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14

  license-required:
    name: Explain why builds were skipped
    needs: preflight
    if: needs.preflight.outputs.unity_license_configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print setup requirement
        run: |
          echo "No APK or server binary was produced."
          echo "Add a valid UNITY_LICENSE secret in Settings > Secrets and variables > Actions."
          echo "Then run this workflow again from Actions > YASSER GTA Android and Dedicated Server Builds."
