name: Rename repository to YASSER-GTA

on:
  push:
    paths:
      - ".github/workflows/rename-repository.yml"
  workflow_dispatch:

permissions:
  administration: write
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository and update description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f name="YASSER-GTA" \
            -f description="YASSER GTA — Android-focused San Andreas Unity project by Yasser Benmaghnia"
