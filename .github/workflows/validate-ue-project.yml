name: Validate Unreal project structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without downloading large LFS assets
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate UE project, splash, Arabic startup and Android profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          project = json.loads(Path("Football.uproject").read_text(encoding="utf-8"))
          assert project.get("EngineAssociation") == "5.8", "Expected Unreal Engine 5.8"
          assert any(m.get("Name") == "Football" and m.get("Type") == "Runtime" for m in project.get("Modules", [])), "Football runtime module is not registered"
          required = ["Source/Football/Football.Build.cs", "Source/Football.Target.cs", "Source/FootballEditor.Target.cs", "Source/Football/Public/UltimateFootballGameInstance.h", "Source/Football/Private/UltimateFootballGameInstance.cpp", "Source/Football/Public/UltimateFootballSplashWidget.h", "Source/Football/Private/UltimateFootballSplashWidget.cpp", "Content/Ascertainty/Maps/Lvl_Reveal.umap", "Content/Ascertainty/Maps/Lvl_Match.umap", "Config/DefaultDeviceProfiles.ini"]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, "Missing project files: " + ", ".join(missing)
          engine = Path("Config/DefaultEngine.ini").read_text(encoding="utf-8")
          assert "GameInstanceClass=/Script/Football.UltimateFootballGameInstance" in engine, "Splash GameInstance is not configured"
          assert "EditorStartupMap=/Game/Ascertainty/Maps/Lvl_Reveal.Lvl_Reveal" in engine, "Reveal map is not startup map"
          assert "PackageName=com.yasserbenmaghnia.ultimatefootballonline" in engine and "bBuildForArm64=True" in engine, "Android package configuration missing"
          device = Path("Config/DefaultDeviceProfiles.ini").read_text(encoding="utf-8")
          for setting in ("r.ScreenPercentage=60", "r.ViewDistanceScale=0.45", "r.ShadowQuality=0", "r.Streaming.PoolSize=256", "t.MaxFPS=30"):
              assert setting in device, "Missing Android setting: " + setting
          game_instance = Path("Source/Football/Private/UltimateFootballGameInstance.cpp").read_text(encoding="utf-8")
          assert 'SetCurrentCulture(TEXT("ar"))' in game_instance, "Arabic startup culture missing"
          splash = Path("Source/Football/Private/UltimateFootballSplashWidget.cpp").read_text(encoding="utf-8")
          assert "YASSER BENMAGHNIA" in splash and "SetShadowOffset" in splash, "Creator wordmark styling missing"
          assert "FLinearColor(1.0f, 0.66f, 0.69f, 1.0f)" in splash, "Light-red background missing"
          assert "4.0f" in splash and "ULTIMATE FOOTBALL ONLINE" in splash, "Four-second splash/title missing"
          print("Static project validation passed; Unreal compilation and Android device testing are still required.")
          PY